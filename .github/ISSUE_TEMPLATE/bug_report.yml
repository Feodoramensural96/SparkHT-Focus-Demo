name: Bug 报告
description: 报告一个可复现的错误
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先移除配对码、真实会话图片、音频和个人信息。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么？预期是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 使用配置……
        2. 运行命令……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python、提交 SHA、SDK 版本、是否连接 GPU/机器人。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除秘密和可识别个人身份的数据。
          required: true
